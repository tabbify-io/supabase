# Tabbify fork: build Studio ONCE and publish it, instead of building it per
# deployment.
#
# Every Supabase deployment used to wait for its own `next build`, because the
# base path (`/app/<uuid>`) and the public address are inlined into the bundle
# and differ per deployment. This image is built with placeholders instead;
# `apps/studio/docker-entrypoint-tabbify.sh` writes the real values over them at
# boot. The curated `supabase@1` document then pins the published index digest.
#
# Output: ghcr.io/tabbify-io/supabase-studio:<commit>, an index carrying
# linux/amd64 and linux/arm64 (images.lock requires both). Each arch builds on
# its own native runner; the digest of the index is in the run summary.
name: Tabbify Studio image

on:
  push:
    branches: [tabbify-studio-fixes]
    paths:
      - 'apps/studio/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/tabbify-studio-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: tabbify-studio-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/tabbify-io/supabase-studio

jobs:
  build:
    if: github.repository == 'tabbify-io/supabase'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The placeholders must match docker-entrypoint-tabbify.sh exactly. The
      # base path one is `/app/<uuid>`-long on purpose (see the script).
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/studio/Dockerfile
          target: production
          platforms: linux/${{ matrix.arch }}
          build-args: |
            NEXT_PUBLIC_BASE_PATH=/app/ffffffff-tbfy-base-path-placeholder0
            NEXT_PUBLIC_SITE_URL=https://tabbify-studio-site.invalid/
            NEXT_PUBLIC_GOTRUE_URL=https://tabbify-studio-site.invalid/auth/v1
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          retention-days: 1

  index:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: create the multi-arch index
        run: |
          set -euo pipefail
          tag="${IMAGE}:${GITHUB_SHA}"
          docker buildx imagetools create -t "$tag" \
            "${IMAGE}@$(cat /tmp/digests/amd64)" \
            "${IMAGE}@$(cat /tmp/digests/arm64)"
          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
          {
            echo "### Studio image"
            echo
            echo "\`${IMAGE}@${digest}\`"
            echo
            echo "Mirror it into our registry with its digest preserved, then pin that digest in supabase@1."
          } >> "$GITHUB_STEP_SUMMARY"
